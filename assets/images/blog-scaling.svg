<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="scalingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B" />
      <stop offset="100%" style="stop-color:#008C59" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#1A1A2E" />
  
  <!-- Grid lines -->
  <g stroke="#333355" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="250" x2="600" y2="250" />
    
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="550" y1="0" x2="550" y2="300" />
  </g>
  
  <!-- Scaling graph -->
  <polyline points="50,250 150,200 250,180 350,120 450,70 550,50" fill="none" stroke="url(#scalingGradient)" stroke-width="5" />
  
  <!-- Data points -->
  <circle cx="50" cy="250" r="8" fill="url(#scalingGradient)" />
  <circle cx="150" cy="200" r="8" fill="url(#scalingGradient)" />
  <circle cx="250" cy="180" r="8" fill="url(#scalingGradient)" />
  <circle cx="350" cy="120" r="8" fill="url(#scalingGradient)" />
  <circle cx="450" cy="70" r="8" fill="url(#scalingGradient)" />
  <circle cx="550" cy="50" r="8" fill="url(#scalingGradient)" />
  
  <!-- Server icons -->
  <g transform="translate(50, 250) scale(0.5)">
    <rect x="-15" y="-15" width="30" height="30" fill="#FFFFFF" opacity="0.2" />
  </g>
  <g transform="translate(150, 200) scale(0.6)">
    <rect x="-15" y="-15" width="30" height="30" fill="#FFFFFF" opacity="0.3" />
  </g>
  <g transform="translate(250, 180) scale(0.7)">
    <rect x="-15" y="-15" width="30" height="30" fill="#FFFFFF" opacity="0.4" />
  </g>
  <g transform="translate(350, 120) scale(0.8)">
    <rect x="-15" y="-15" width="30" height="30" fill="#FFFFFF" opacity="0.5" />
  </g>
  <g transform="translate(450, 70) scale(0.9)">
    <rect x="-15" y="-15" width="30" height="30" fill="#FFFFFF" opacity="0.6" />
  </g>
  <g transform="translate(550, 50) scale(1.0)">
    <rect x="-15" y="-15" width="30" height="30" fill="#FFFFFF" opacity="0.7" />
  </g>
  
  <!-- TPS Counter -->
  <g transform="translate(300, 100)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="url(#scalingGradient)" opacity="0.8" />
    <text x="0" y="0" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">2500+ TPS</text>
  </g>
  
  <!-- Title -->
  <text x="300" y="240" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Scaling UPI Stack</text>
  <text x="300" y="270" font-family="Arial" font-size="18" text-anchor="middle" fill="#FFFFFF">High Performance Transaction Processing</text>
</svg>

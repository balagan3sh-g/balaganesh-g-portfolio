<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="profileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B" />
      <stop offset="100%" style="stop-color:#008C59" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f4f4f4" />
  
  <!-- Profile silhouette -->
  <circle cx="200" cy="150" r="80" fill="url(#profileGradient)" />
  <path d="M100,400 L100,300 C100,240 150,200 200,200 C250,200 300,240 300,300 L300,400 Z" fill="url(#profileGradient)" />
  
  <!-- Decorative elements -->
  <circle cx="200" cy="400" r="150" fill="#00A86B" opacity="0.1" />
  <text x="200" y="350" font-family="Arial" font-size="20" text-anchor="middle" fill="#333333">Balaganesh G</text>
  <text x="200" y="375" font-family="Arial" font-size="14" text-anchor="middle" fill="#666666">Site Reliability Engineer</text>
</svg>

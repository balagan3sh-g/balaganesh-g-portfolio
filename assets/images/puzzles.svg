<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="puzzleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B" />
      <stop offset="100%" style="stop-color:#008C59" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f4f4f4" />
  
  <!-- Rubik's Cube representation -->
  <g transform="translate(125, 50)">
    <!-- Front face -->
    <rect x="0" y="0" width="150" height="150" fill="#FFFFFF" stroke="#333333" stroke-width="2" />
    
    <!-- Cube grid -->
    <line x1="0" y1="50" x2="150" y2="50" stroke="#333333" stroke-width="2" />
    <line x1="0" y1="100" x2="150" y2="100" stroke="#333333" stroke-width="2" />
    <line x1="50" y1="0" x2="50" y2="150" stroke="#333333" stroke-width="2" />
    <line x1="100" y1="0" x2="100" y2="150" stroke="#333333" stroke-width="2" />
    
    <!-- Colored squares -->
    <rect x="0" y="0" width="50" height="50" fill="#FF0000" />
    <rect x="50" y="0" width="50" height="50" fill="#0000FF" />
    <rect x="100" y="0" width="50" height="50" fill="#FF0000" />
    <rect x="0" y="50" width="50" height="50" fill="#FFFF00" />
    <rect x="50" y="50" width="50" height="50" fill="url(#puzzleGradient)" />
    <rect x="100" y="50" width="50" height="50" fill="#FFFF00" />
    <rect x="0" y="100" width="50" height="50" fill="#FF0000" />
    <rect x="50" y="100" width="50" height="50" fill="#0000FF" />
    <rect x="100" y="100" width="50" height="50" fill="#FFFF00" />
  </g>
  
  <!-- Title -->
  <text x="200" y="250" font-family="Arial" font-size="20" text-anchor="middle" fill="#333333">Rubik's Puzzles</text>
</svg>

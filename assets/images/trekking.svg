<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="mountainGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00A86B" />
      <stop offset="100%" style="stop-color:#008C59" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB" />
      <stop offset="100%" style="stop-color:#E0F7FF" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#skyGradient)" />
  
  <!-- Sun -->
  <circle cx="320" cy="50" r="30" fill="#FFD700" />
  <circle cx="320" cy="50" r="40" fill="#FFD700" opacity="0.3" />
  
  <!-- Mountains -->
  <path d="M0,300 L100,150 L150,200 L200,100 L300,180 L350,120 L400,200 L400,300 Z" fill="url(#mountainGradient)" />
  <path d="M0,300 L50,200 L100,250 L150,180 L250,220 L300,150 L400,250 L400,300 Z" fill="#006643" />
  
  <!-- Trekking path -->
  <path d="M50,300 C100,280 150,290 200,270 C250,250 300,260 350,240" fill="none" stroke="#B8860B" stroke-width="5" stroke-dasharray="10,5" />
  
  <!-- Trekker silhouette -->
  <g transform="translate(150, 200)">
    <!-- Body -->
    <line x1="0" y1="0" x2="0" y2="40" stroke="#333333" stroke-width="4" />
    
    <!-- Legs -->
    <line x1="0" y1="40" x2="-10" y2="70" stroke="#333333" stroke-width="4" />
    <line x1="0" y1="40" x2="10" y2="70" stroke="#333333" stroke-width="4" />
    
    <!-- Arms -->
    <line x1="0" y1="10" x2="-15" y2="30" stroke="#333333" stroke-width="4" />
    <line x1="0" y1="10" x2="20" y2="20" stroke="#333333" stroke-width="4" />
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="10" fill="#333333" />
    
    <!-- Trekking pole -->
    <line x1="20" y1="20" x2="30" y2="70" stroke="#333333" stroke-width="2" />
  </g>
  
  <!-- Title -->
  <text x="200" y="270" font-family="Arial" font-size="20" text-anchor="middle" fill="#FFFFFF" stroke="#333333" stroke-width="0.5">Trekking Adventures</text>
</svg>

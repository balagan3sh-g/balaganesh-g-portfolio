<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bikeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B" />
      <stop offset="100%" style="stop-color:#008C59" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f4f4f4" />
  
  <!-- Motorcycle illustration -->
  <g transform="translate(50, 100)">
    <!-- Wheels -->
    <circle cx="50" cy="100" r="40" fill="none" stroke="#333333" stroke-width="5" />
    <circle cx="250" cy="100" r="40" fill="none" stroke="#333333" stroke-width="5" />
    
    <!-- Spokes -->
    <line x1="50" y1="60" x2="50" y2="140" stroke="#333333" stroke-width="2" />
    <line x1="10" y1="100" x2="90" y2="100" stroke="#333333" stroke-width="2" />
    <line x1="20" y1="70" x2="80" y2="130" stroke="#333333" stroke-width="2" />
    <line x1="20" y1="130" x2="80" y2="70" stroke="#333333" stroke-width="2" />
    
    <line x1="250" y1="60" x2="250" y2="140" stroke="#333333" stroke-width="2" />
    <line x1="210" y1="100" x2="290" y2="100" stroke="#333333" stroke-width="2" />
    <line x1="220" y1="70" x2="280" y2="130" stroke="#333333" stroke-width="2" />
    <line x1="220" y1="130" x2="280" y2="70" stroke="#333333" stroke-width="2" />
    
    <!-- Frame -->
    <path d="M50,100 L120,40 L200,40 L250,100" fill="none" stroke="url(#bikeGradient)" stroke-width="10" />
    <path d="M120,40 L150,100" fill="none" stroke="url(#bikeGradient)" stroke-width="10" />
    <path d="M150,100 L50,100" fill="none" stroke="url(#bikeGradient)" stroke-width="10" />
    <path d="M150,100 L250,100" fill="none" stroke="url(#bikeGradient)" stroke-width="10" />
    
    <!-- Handlebars -->
    <path d="M200,40 L210,20 C220,10 240,10 250,20" fill="none" stroke="#333333" stroke-width="5" />
    
    <!-- Seat -->
    <rect x="110" y="30" width="30" height="10" rx="5" fill="#333333" />
    
    <!-- Engine -->
    <rect x="130" y="70" width="60" height="30" rx="5" fill="#333333" />
    
    <!-- Exhaust -->
    <path d="M130,85 L100,85 L90,95" fill="none" stroke="#333333" stroke-width="5" />
  </g>
  
  <!-- Title -->
  <text x="200" y="250" font-family="Arial" font-size="20" text-anchor="middle" fill="#333333">Hero Maverick 440</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="awsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B" />
      <stop offset="100%" style="stop-color:#008C59" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#232F3E" />
  
  <!-- AWS Cloud Symbol -->
  <path d="M300,80 C360,80 410,110 410,150 C450,150 480,180 480,220 C480,260 450,290 410,290 L190,290 C150,290 120,260 120,220 C120,180 150,150 190,150 C190,110 240,80 300,80 Z" fill="#FFFFFF" opacity="0.1" />
  
  <!-- Dollar signs representing cost savings -->
  <text x="200" y="150" font-family="Arial" font-size="60" font-weight="bold" text-anchor="middle" fill="#FFFFFF">$</text>
  <text x="300" y="150" font-family="Arial" font-size="60" font-weight="bold" text-anchor="middle" fill="#FFFFFF">$</text>
  <text x="400" y="150" font-family="Arial" font-size="60" font-weight="bold" text-anchor="middle" fill="#FFFFFF">$</text>
  
  <!-- Downward arrow representing cost reduction -->
  <path d="M300,180 L340,220 L320,220 L320,260 L280,260 L280,220 L260,220 Z" fill="url(#awsGradient)" />
  
  <!-- AWS Logo simplified -->
  <g transform="translate(270, 50) scale(0.5)">
    <path d="M55,30 L30,30 L30,55 L55,55 Z" fill="#FF9900" />
    <path d="M60,30 L85,30 L85,55 L60,55 Z" fill="#FF9900" />
    <path d="M60,60 L85,60 L85,85 L60,85 Z" fill="#FF9900" />
    <path d="M30,60 L55,60 L55,85 L30,85 Z" fill="#FF9900" />
  </g>
  
  <!-- Title -->
  <text x="300" y="240" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">AWS Cost Optimization</text>
  <text x="300" y="270" font-family="Arial" font-size="18" text-anchor="middle" fill="#FFFFFF">$240,000 Annual Savings</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="musicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B" />
      <stop offset="100%" style="stop-color:#008C59" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f4f4f4" />
  
  <!-- Music notes and waves -->
  <path d="M50,150 C100,100 150,200 200,150 C250,100 300,200 350,150" fill="none" stroke="url(#musicGradient)" stroke-width="3" />
  <path d="M50,170 C100,120 150,220 200,170 C250,120 300,220 350,170" fill="none" stroke="url(#musicGradient)" stroke-width="3" />
  
  <!-- IEM (In-Ear Monitor) illustration -->
  <g transform="translate(150, 120)">
    <!-- Earphone body -->
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="url(#musicGradient)" />
    <ellipse cx="0" cy="0" rx="30" ry="18" fill="#333333" />
    
    <!-- Ear tip -->
    <ellipse cx="-45" cy="0" rx="15" ry="10" fill="#CCCCCC" />
    <path d="M-30,0 L-45,0" stroke="#CCCCCC" stroke-width="10" />
    
    <!-- Cable -->
    <path d="M40,0 C60,0 70,20 80,40 C90,60 100,80 120,80" fill="none" stroke="#333333" stroke-width="3" />
  </g>
  
  <!-- Music notes -->
  <g transform="translate(250, 80)">
    <!-- Quarter note -->
    <circle cx="0" cy="0" r="10" fill="#333333" />
    <line x1="10" y1="0" x2="10" y2="-40" stroke="#333333" stroke-width="3" />
    
    <!-- Eighth note -->
    <circle cx="40" cy="20" r="10" fill="#333333" />
    <line x1="50" y1="20" x2="50" y2="-20" stroke="#333333" stroke-width="3" />
    <path d="M50,-20 C60,-20 60,0 70,0" fill="none" stroke="#333333" stroke-width="3" />
  </g>
  
  <!-- Title -->
  <text x="200" y="250" font-family="Arial" font-size="20" text-anchor="middle" fill="#333333">Music & IEMs</text>
</svg>
